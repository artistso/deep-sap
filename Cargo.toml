[package]
name = "deep_sap"
version = "0.2.0"
edition = "2021"
rust-version = "1.82"
description = "DEEP SAP - unclassified synthetic ocean sensor-fusion simulation with public environmental context"
authors = ["Steven Owens <steven@soquarky.click>"]
license = "MIT"
repository = "https://github.com/artistso/deep-sap"

[dependencies]
bevy = { version = "=0.15.3", default-features = false, features = [
  "bevy_asset",
  "bevy_winit",
  "bevy_core_pipeline",
  "bevy_render",
  "bevy_sprite",
  "bevy_text",
  "bevy_ui",
  "bevy_gizmos",
  "multi_threaded",
  "png",
  "default_font",
  "webgl2",
  "x11",
] }
rand = { version = "0.8", features = ["small_rng"] }
serde = { version = "1.0", features = ["derive"] }
serde_json = "1.0"
futures-lite = "2.3"

[target.'cfg(target_arch = "wasm32")'.dependencies]
wasm-bindgen = "0.2"
web-sys = { version = "0.3", features = ["Window"] }
getrandom_02 = { package = "getrandom", version = "0.2.17", features = ["js"] }
getrandom_03 = { package = "getrandom", version = "0.3.4", features = ["wasm_js"] }
gloo-net = { version = "0.6", features = ["json"] }
js-sys = "0.3"

[[bin]]
name = "deep_sap"
path = "src/main.rs"

[profile.dev]
opt-level = 1

[profile.dev.package."*"]
opt-level = 3

[profile.release]
opt-level = "s"
lto = true
codegen-units = 1
panic = "abort"
strip = true
