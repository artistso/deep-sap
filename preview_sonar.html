<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8"/>
  <meta name="viewport" content="width=device-width,initial-scale=1,maximum-scale=1,user-scalable=no"/>
  <meta name="theme-color" content="#001122"/>
  <meta name="referrer" content="no-referrer"/>
  <title>DEEP SAP — Observation-Only Preview</title>
  <style>
    html,body{margin:0;height:100%;overflow:hidden;background:#001122;color:#b9eaff;font:13px ui-monospace,monospace}
    #app{height:100%;display:grid;grid-template-rows:auto 1fr 140px auto}
    header,#status{padding:10px 14px;background:#001a2a;border-color:#14506b;border-style:solid;border-width:0 0 1px}
    header{display:flex;justify-content:space-between;gap:16px;flex-wrap:wrap}
    canvas{display:block;width:100%;height:100%;touch-action:none;background:radial-gradient(circle at center,#0b304d,#001122 72%)}
    #waterfall{background:#020b12;border-top:1px solid #14506b}
    #status{min-height:36px;border-width:1px 0 0;line-height:1.5}
  </style>
</head>
<body>
<div id="app">
  <header><strong>DEEP SAP // OBSERVATION-ONLY JS PREVIEW</strong><span id="metrics">INITIALIZING</span></header>
  <canvas id="plot" aria-label="Synthetic bearing plot"></canvas>
  <canvas id="waterfall" width="1200" height="140" aria-label="Synthetic bearing waterfall"></canvas>
  <div id="status">Synthetic truth is hidden. Only noisy bearings, tonal evidence, and estimated track fixes are rendered.</div>
</div>
<script>
(() => {
  "use strict";
  const plot = document.getElementById("plot");
  const ctx = plot.getContext("2d");
  const waterfall = document.getElementById("waterfall");
  const wctx = waterfall.getContext("2d");
  const metrics = document.getElementById("metrics");
  const status = document.getElementById("status");

  const KNOT_TO_KM_S = 1.852 / 3600;
  const truth = Array.from({length:10}, (_, index) => {
    const submarine = index < 4;
    const angle = Math.random() * Math.PI * 2;
    const range = submarine ? 9 + Math.random() * 19 : 5 + Math.random() * 18;
    return {
      x: Math.sin(angle) * range,
      y: Math.cos(angle) * range,
      vx: (Math.random() - 0.5) * (submarine ? 8 : 3),
      vy: (Math.random() - 0.5) * (submarine ? 8 : 3),
      frequency: submarine ? 58 + Math.random() * 95 : 8 + Math.random() * 30,
      sourceLevel: submarine ? 160 + Math.random() * 8 : 150 + Math.random() * 8,
      submarine,
    };
  });

  const ownship = {x:0,y:0,vx:Math.sin(25*Math.PI/180)*8,vy:Math.cos(25*Math.PI/180)*8};
  const ownshipHistory = [];
  const observations = [];
  const tracks = [];
  let elapsed = 0;
  let sweepClock = 0;
  let cursorBearing = 0;
  let penActive = false;
  let lastFrame = performance.now();

  function resize() {
    const ratio = Math.max(1, devicePixelRatio || 1);
    plot.width = Math.round(plot.clientWidth * ratio);
    plot.height = Math.round(plot.clientHeight * ratio);
  }
  addEventListener("resize", resize);
  resize();

  function bearingFrom(dx, dy) {
    return (Math.atan2(dx, dy) * 180 / Math.PI + 360) % 360;
  }
  function navVector(degrees) {
    const radians = degrees * Math.PI / 180;
    return {x:Math.sin(radians), y:Math.cos(radians)};
  }
  function angularDistance(a, b) {
    return Math.abs(((a - b + 540) % 360) - 180);
  }
  function noise() {
    return (Math.random()+Math.random()+Math.random()+Math.random()+Math.random()+Math.random()-3) * 0.82;
  }
  function crossFix(a, b) {
    const av = navVector(a.bearing);
    const bv = navVector(b.bearing);
    const determinant = av.x * bv.y - av.y * bv.x;
    if (Math.abs(determinant) < 0.03) return null;
    const dx = b.ox - a.ox;
    const dy = b.oy - a.oy;
    const ta = (dx * bv.y - dy * bv.x) / determinant;
    const tb = (dx * av.y - dy * av.x) / determinant;
    if (ta < 0 || tb < 0) return null;
    const x = a.ox + ta * av.x;
    const y = a.oy + ta * av.y;
    if (!Number.isFinite(x) || !Number.isFinite(y) || Math.hypot(x,y) > 100) return null;
    return {x,y};
  }
  function median(values) {
    const sorted = [...values].sort((a,b)=>a-b);
    return sorted[Math.floor(sorted.length/2)];
  }
  function estimateTrack(track) {
    if (track.samples.length < 5) return;
    const recent = track.samples.slice(-16);
    const fixes = [];
    for (let i=0;i<recent.length;i++) {
      for (let j=i+1;j<recent.length;j++) {
        const fix = crossFix(recent[i], recent[j]);
        if (fix) fixes.push(fix);
      }
    }
    if (fixes.length < 3) return;
    track.fix = {x:median(fixes.map(f=>f.x)), y:median(fixes.map(f=>f.y))};
  }
  function associate(observation) {
    let best = null;
    let score = Infinity;
    for (const track of tracks) {
      if (elapsed - track.lastSeen > 18) continue;
      const angleError = angularDistance(track.bearing, observation.bearing);
      const frequencyError = Math.abs(track.frequency - observation.frequency);
      const candidate = angleError / 8 + frequencyError / 18;
      if (angleError <= 8 && frequencyError <= 18 && candidate < score) {
        best = track;
        score = candidate;
      }
    }
    if (!best) {
      best = {id:tracks.length+1,bearing:observation.bearing,frequency:observation.frequency,lastSeen:elapsed,samples:[],fix:null};
      tracks.push(best);
    }
    best.bearing = observation.bearing;
    best.frequency = best.frequency * 0.8 + observation.frequency * 0.2;
    best.lastSeen = elapsed;
    best.samples.push(observation);
    if (best.samples.length > 32) best.samples.shift();
    estimateTrack(best);
  }
  function sensorSweep() {
    for (const source of truth) {
      const dx = source.x - ownship.x;
      const dy = source.y - ownship.y;
      const range = Math.max(0.1, Math.hypot(dx,dy));
      const loss = 20 * Math.log10(range * 1000);
      const snr = source.sourceLevel - loss - 43;
      const confidence = Math.max(0, Math.min(1, (snr + 12) / 24));
      if (confidence < 0.08 || Math.random() > 0.15 + confidence * 0.85) continue;
      const sigma = 4.5 - confidence * 4;
      const observation = {
        ox:ownship.x, oy:ownship.y,
        bearing:(bearingFrom(dx,dy) + noise()*sigma + 360) % 360,
        frequency:Math.max(0, source.frequency + noise()*(0.5+(1-confidence)*3)),
        confidence, snr, time:elapsed,
      };
      observations.push(observation);
      associate(observation);
    }
    while (observations.length && elapsed - observations[0].time > 18) observations.shift();
    while (tracks.length && elapsed - tracks[0].lastSeen > 45) tracks.shift();
  }

  function pointer(event) {
    const rect = plot.getBoundingClientRect();
    const x = event.clientX - rect.left - rect.width/2;
    const y = rect.height/2 - (event.clientY - rect.top);
    cursorBearing = bearingFrom(x,y);
    penActive = event.pointerType === "pen";
  }
  plot.addEventListener("pointermove", pointer, {passive:true});
  plot.addEventListener("pointerdown", pointer, {passive:true});
  plot.addEventListener("pointerout", () => { penActive = false; }, {passive:true});

  function worldToCanvas(x,y,cx,cy,scale) {
    return {x:cx+x*scale,y:cy-y*scale};
  }
  function drawPlot() {
    const ratio = Math.max(1, devicePixelRatio || 1);
    const width = plot.width/ratio;
    const height = plot.height/ratio;
    ctx.setTransform(ratio,0,0,ratio,0,0);
    ctx.clearRect(0,0,width,height);
    const cx=width/2, cy=height/2, scale=Math.min(cx,cy)/38;

    ctx.lineWidth=1;
    ctx.strokeStyle="rgba(70,160,220,.18)";
    for (const radius of [5,10,15,20,30]) {
      ctx.beginPath(); ctx.arc(cx,cy,radius*scale,0,Math.PI*2); ctx.stroke();
    }
    for (let degrees=0;degrees<360;degrees+=30) {
      const v=navVector(degrees);
      ctx.beginPath(); ctx.moveTo(cx+v.x*30*scale,cy-v.y*30*scale); ctx.lineTo(cx+v.x*35*scale,cy-v.y*35*scale); ctx.stroke();
    }

    ctx.strokeStyle="rgba(70,255,170,.35)";
    ctx.beginPath();
    ownshipHistory.forEach((point,index) => {
      const p=worldToCanvas(point.x,point.y,cx,cy,scale);
      index ? ctx.lineTo(p.x,p.y) : ctx.moveTo(p.x,p.y);
    });
    ctx.stroke();

    for (const observation of observations) {
      const age = elapsed-observation.time;
      const alpha=Math.max(0,1-age/18)*observation.confidence*.28;
      const origin=worldToCanvas(observation.ox,observation.oy,cx,cy,scale);
      const v=navVector(observation.bearing);
      ctx.strokeStyle=`rgba(90,200,255,${alpha})`;
      ctx.beginPath(); ctx.moveTo(origin.x,origin.y); ctx.lineTo(origin.x+v.x*42*scale,origin.y-v.y*42*scale); ctx.stroke();
    }

    for (const track of tracks) {
      if (!track.fix) continue;
      const p=worldToCanvas(track.fix.x,track.fix.y,cx,cy,scale);
      ctx.strokeStyle="rgba(255,205,80,.9)";
      ctx.lineWidth=2;
      ctx.beginPath(); ctx.arc(p.x,p.y,6,0,Math.PI*2); ctx.stroke();
      ctx.fillStyle="rgba(255,225,130,.9)";
      ctx.fillText(`T${String(track.id).padStart(2,"0")}`,p.x+9,p.y-7);
    }

    const own=worldToCanvas(ownship.x,ownship.y,cx,cy,scale);
    ctx.fillStyle="#4fffa8"; ctx.beginPath(); ctx.arc(own.x,own.y,6,0,Math.PI*2); ctx.fill();
    const cursor=navVector(cursorBearing);
    ctx.strokeStyle="rgba(255,255,150,.9)"; ctx.lineWidth=2;
    ctx.beginPath(); ctx.moveTo(own.x,own.y); ctx.lineTo(own.x+cursor.x*40*scale,own.y-cursor.y*40*scale); ctx.stroke();
  }

  function drawWaterfall() {
    const width=waterfall.width, height=waterfall.height;
    wctx.drawImage(waterfall,0,1,width,height-1,0,0,width,height-1);
    wctx.fillStyle="#020b12"; wctx.fillRect(0,height-1,width,1);
    for (const observation of observations.filter(item => elapsed-item.time < 0.7)) {
      const x=observation.bearing/360*width;
      const intensity=Math.max(.05,observation.confidence);
      wctx.fillStyle=`rgba(90,210,255,${intensity})`;
      wctx.fillRect(x,height-1,2,Math.max(1,Math.round(intensity*5)));
    }
    wctx.fillStyle="rgba(255,255,150,.9)";
    wctx.fillRect(cursorBearing/360*width,0,1,height);
  }

  function frame(now) {
    const dt=Math.min(.05,(now-lastFrame)/1000);
    lastFrame=now;
    elapsed+=dt;
    sweepClock+=dt;
    ownship.x+=ownship.vx*KNOT_TO_KM_S*dt;
    ownship.y+=ownship.vy*KNOT_TO_KM_S*dt;
    for (const source of truth) {
      source.x+=source.vx*KNOT_TO_KM_S*dt;
      source.y+=source.vy*KNOT_TO_KM_S*dt;
    }
    if (!ownshipHistory.length || Math.hypot(ownship.x-ownshipHistory.at(-1).x,ownship.y-ownshipHistory.at(-1).y)>.03) {
      ownshipHistory.push({x:ownship.x,y:ownship.y});
      if (ownshipHistory.length>180) ownshipHistory.shift();
    }
    if (sweepClock>=.5) { sweepClock-=.5; sensorSweep(); }
    drawPlot();
    drawWaterfall();
    const fixed=tracks.filter(track=>track.fix).length;
    metrics.textContent=`T ${elapsed.toFixed(0)}s | OBS ${observations.length} | TRACKS ${tracks.length} | FIXES ${fixed} | ${penActive?"PEN":"POINTER"}`;
    status.textContent=fixed
      ? "Estimated fixes use noisy bearings from the moving observer; source truth remains hidden."
      : "Building observer baseline and track history; no position fix is asserted yet.";
    requestAnimationFrame(frame);
  }
  requestAnimationFrame(frame);
})();
</script>
</body>
</html>
