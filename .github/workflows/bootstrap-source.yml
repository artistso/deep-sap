name: Bootstrap stabilization source

on:
  push:
    branches:
      - bootstrap/stabilization-v0.2
    paths:
      - '.github/workflows/bootstrap-source.yml'

permissions:
  contents: write

jobs:
  expand-source:
    runs-on: ubuntu-latest
    steps:
      - name: Check out bootstrap branch
        uses: actions/checkout@v4
        with:
          ref: bootstrap/stabilization-v0.2
          fetch-depth: 0

      - name: Reconstruct and verify source archive
        shell: bash
        run: |
          set -euo pipefail
          cat .bootstrap/part-*.b64 | base64 --decode > /tmp/deep-sap-source.tar.gz
          echo "439a8d3474db334cd3bbc58cdec03aa89401b2b4f73e7b01c6f61d7363abeeb8  /tmp/deep-sap-source.tar.gz" | sha256sum --check
          tar -tzf /tmp/deep-sap-source.tar.gz >/dev/null

      - name: Expand project and remove bootstrap transport
        shell: bash
        run: |
          set -euo pipefail
          tar -xzf /tmp/deep-sap-source.tar.gz
          rm -rf .bootstrap
          rm -f .github/workflows/bootstrap-source.yml

      - name: Commit reconstructed source
        shell: bash
        run: |
          set -euo pipefail
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          git commit -m "feat: bootstrap DEEP SAP stabilization v0.2"
          git push origin HEAD:bootstrap/stabilization-v0.2
