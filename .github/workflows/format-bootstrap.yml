name: Format bootstrap branch once

on:
  push:
    branches:
      - bootstrap/stabilization-v0.2
    paths:
      - '.github/workflows/format-bootstrap.yml'

permissions:
  contents: write

jobs:
  rustfmt:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
        with:
          ref: bootstrap/stabilization-v0.2
          fetch-depth: 0
      - uses: dtolnay/rust-toolchain@stable
        with:
          components: rustfmt
      - name: Apply canonical Rust formatting
        run: cargo fmt --all
      - name: Remove one-use workflow and commit formatting
        shell: bash
        run: |
          set -euo pipefail
          rm -f .github/workflows/format-bootstrap.yml
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"
          git add -A
          if git diff --cached --quiet; then
            exit 0
          fi
          git commit -m "style: apply cargo fmt"
          git push origin HEAD:bootstrap/stabilization-v0.2
